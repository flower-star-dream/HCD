name: CI/CD Pipeline

on:
  push:
    branches: [ main, dev, feature/release-* ]
  pull_request:
    branches: [ main, dev ]
  workflow_dispatch:

env:
  DOCKER_REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}
  MAVEN_OPTS: -Xmx2g -XX:+UseG1GC -XX:G1HeapRegionSize=16m -XX:G1ReservePercent=25 -XX:InitiatingHeapOccupancyPercent=30

jobs:
  # 代码质量检查
  # code-quality:
  #   name: Code Quality Check
  #   runs-on: ubuntu-latest
  #   steps:
  #     - name: Checkout code
