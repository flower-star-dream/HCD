  #       with:
  #         java-version: '17'
  #         distribution: 'temurin'

  #     - name: Cache Maven dependencies
  #       uses: actions/cache@v4
  #       with:
  #         path: ~/.m2
  #         key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
  #         restore-keys: ${{ runner.os }}-m2

  #     - name: Run Maven tests
  #       run: |
  #         cd backend
  #         mvn clean test -B -q

  #     - name: Run Maven checkstyle
  #       run: |
  #         cd backend
  #         mvn checkstyle:check -B -q || true

  #     - name: SonarCloud Scan
  #       uses: SonarSource/sonarcloud-github-action@master
  #       env:
  #         GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  #         SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
  #       with:
  #         projectBaseDir: backend

  # 构建后端服务
  build-backend:
    name: Build Backend Services
    runs-on: ubuntu-latest
    needs: code-quality
    strategy:
      matrix:
        service: [gateway, user, trainseat, ticket, order]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Build backend service
        run: |
          cd backend
          mvn clean package -DskipTests -B -q

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_PREFIX }}/hcd-${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./dockerfiles/services/Dockerfile.${{ matrix.service }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 构建前端
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    needs: code-quality
    strategy:
      matrix:
        app: [hcd-mgmt]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/${{ matrix.app }}/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend/${{ matrix.app }}
          npm ci

      - name: Build application
        run: |
          cd frontend/${{ matrix.app }}
          npm run build:prod

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_PREFIX }}/hcd-${{ matrix.app }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend/${{ matrix.app }}
          file: ./dockerfiles/frontend/Dockerfile.mgmt
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 构建Nginx
  build-nginx:
    name: Build Nginx
    runs-on: ubuntu-latest
    needs: [build-frontend]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_PREFIX }}/hcd-nginx
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend/nginx
          file: ./frontend/nginx/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 安全扫描
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend, build-nginx]
    steps:
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_PREFIX }}/hcd-gateway:${{ github.sha }}'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'

  # 部署到测试环境
  deploy-test:
    name: Deploy to Test Environment
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend, build-nginx, security-scan]
    if: github.ref == 'refs/heads/develop'
    environment:
      name: test
      url: https://test.hcd.com
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.TEST_SSH_KEY }}

      - name: Deploy to test server
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.TEST_USER }}@${{ secrets.TEST_HOST }} << 'EOF'
            cd /opt/hcd
            docker-compose -f docker-compose.test.yml pull
            docker-compose -f docker-compose.test.yml up -d --remove-orphans
            docker system prune -f
          EOF

      - name: Run service checks
        run: |
          sleep 60
          curl -f http://localhost:8080/actuator/info || exit 1

  # 部署到生产环境
  deploy-production:
    name: Deploy to Production Environment
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend, build-nginx, security-scan]
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://hcd.com
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.PROD_SSH_KEY }}

      - name: Deploy to production server
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.PROD_USER }}@${{ secrets.PROD_HOST }} << 'EOF'
            cd /opt/hcd
            # 备份当前版本
            docker-compose -f docker-compose.prod.yml exec -T hcd-gateway tar -czf /backup/hcd-$(date +%Y%m%d-%H%M%S).tar.gz /app/logs

            # 拉取新镜像
            docker-compose -f docker-compose.prod.yml pull

            # 滚动更新
            docker-compose -f docker-compose.prod.yml up -d --no-deps --scale hcd-gateway=2
            sleep 30
            docker-compose -f docker-compose.prod.yml up -d --no-deps --scale hcd-gateway=1

            # 更新其他服务
            docker-compose -f docker-compose.prod.yml up -d --remove-orphans

            # 清理旧镜像
            docker system prune -f
          EOF

      - name: Run service checks
        run: |
          sleep 60
          curl -f http://localhost:8080/actuator/info || exit 1

      - name: Notify deployment success
        if: success()
        run: |
          echo "🚀 Deployment to production completed successfully!"
          echo "📦 Version: ${{ github.sha }}"
          echo "🔗 URL: https://hcd.com"

  # 回滚
  rollback:
    name: Rollback Production
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    environment:
      name: production
    steps:
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.PROD_SSH_KEY }}

      - name: Rollback to previous version
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.PROD_USER }}@${{ secrets.PROD_HOST }} << 'EOF'
            cd /opt/hcd
            # 获取最近的备份
            LATEST_BACKUP=$(ls -t /backup/hcd-*.tar.gz | head -1)

            # 回滚到上一个稳定版本
            docker-compose -f docker-compose.prod.yml down
            docker system prune -f

            # 重新部署上一个版本
            git checkout HEAD~1
            docker-compose -f docker-compose.prod.yml up -d

            echo "🔄 Rollback completed using backup: $LATEST_BACKUP"
          EOF